# Workflow for building and deploying an Astro site to GitHub Pages
name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your repository uses master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better experience with the action
          lfs: true # If your repository uses Git LFS, set this to true
          sparse-checkout: |
            src
            public
            package.json
            astro.config.ts
            tsconfig.json
            
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # Change to pnpm / yarn / bun if you use a different package manager

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci # Change to 'pnpm install' or 'yarn install' if applicable

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Astro builds into the ./dist directory by default

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
